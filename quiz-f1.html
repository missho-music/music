<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miss Ho's Music Lab - 中一樂理任務 🎼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream:   #FFFBF2;
  --yellow:  #FFD94A;
  --coral:   #FF7B6B;
  --mint:    #4ECDC4;
  --purple:  #A78BFA;
  --blue:    #60A5FA;
  --dark:    #2D2640;
  --ink:     #3D3560;
  --muted:   #8B85A8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--cream);
  font-family: 'Poppins', 'Noto Sans TC', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.quiz-container {
  width: 100%;
  max-width: 600px;
  background: white;
  border: 3.5px solid var(--dark);
  border-radius: 24px;
  padding: 36px 32px;
  box-shadow: 7px 7px 0 var(--dark);
  position: relative;
}

.progress-wrapper { margin-bottom: 24px; }
.progress-text {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 800;
  font-size: 14px;
  margin-bottom: 8px;
  color: var(--muted);
}
.timer-box {
  background: #FFF0F0;
  color: var(--coral);
  border: 2px solid var(--dark);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 14px;
  box-shadow: 2px 2px 0 var(--dark);
}
.progress-bar-outer {
  width: 100%;
  height: 16px;
  background: #f0ede6;
  border: 2.5px solid var(--dark);
  border-radius: 999px;
  overflow: hidden;
}
.progress-bar-inner {
  width: 10%;
  height: 100%;
  background: var(--purple);
  transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.question-box { text-align: center; margin-bottom: 28px; }
.question-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.clef-badge {
  padding: 4px 12px;
  border: 2px solid var(--dark);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.clef-badge.treble { background: var(--yellow); }
.clef-badge.bass { background: var(--blue); color: white; }

.staff-wrapper {
  background: #FCFBF7;
  border: 2.5px solid var(--dark);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
  display: flex;
  justify-content: center;
}

.options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.option-btn {
  padding: 16px;
  border: 2.5px solid var(--dark);
  border-radius: 16px;
  font-family: 'Poppins', sans-serif;
  font-weight: 800;
  font-size: 20px;
  background: white;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--dark);
  transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.option-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--dark);
  background: var(--cream);
}
.option-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--dark); }

.result-box { display: none; text-align: center; padding: 20px 0; }
.result-emoji { font-size: 64px; margin-bottom: 16px; }
.result-score { font-size: 48px; font-weight: 900; color: var(--coral); margin-bottom: 8px; }
.result-text { font-size: 16px; font-weight: 700; color: var(--muted); margin-bottom: 28px; }

.action-btn {
  display: inline-block;
  padding: 14px 28px;
  border: 2.5px solid var(--dark);
  border-radius: 16px;
  font-weight: 800;
  font-size: 16px;
  color: var(--dark);
  background: var(--mint);
  text-decoration: none;
  box-shadow: 4px 4px 0 var(--dark);
  cursor: pointer;
  transition: all 0.15s;
}
.action-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--dark); }
</style>
</head>
<body>

<div class="quiz-container">
  <div id="quizBody">
    <div class="progress-wrapper">
      <div class="progress-text">
        <span id="questionNum">任務第 1 / 10 題</span>
        <span id="timerDisplay" class="timer-box">⏱️ 03:00</span>
        <span id="scoreTracker">得分: 0</span>
      </div>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progressBar"></div>
      </div>
    </div>

    <div class="question-box">
      <div class="question-title">
        <span id="clefBadge" class="clef-badge treble">高音譜號</span>
        <span>請辨認五線譜上的音名是什麼？</span>
      </div>
      
      <div class="staff-wrapper">
        <svg width="300" height="150" id="staffSvg" viewBox="0 0 300 150">
          <line x1="10" y1="35" x2="290" y2="35" stroke="#2D2640" stroke-width="2.5"/>
          <line x1="10" y1="50" x2="290" y2="50" stroke="#2D2640" stroke-width="2.5"/>
          <line x1="10" y1="65" x2="290" y2="65" stroke="#2D2640" stroke-width="2.5"/>
          <line x1="10" y1="80" x2="290" y2="80" stroke="#2D2640" stroke-width="2.5"/>
          <line x1="10" y1="95" x2="290" y2="95" stroke="#2D2640" stroke-width="2.5"/>

          <g id="vectorTreble" fill="#2D2640" transform="translate(16, 10) scale(0.48)">
            <path d="M37.7,118.9c-1.9,0-3.7-0.7-5.2-2.1c-2.3-2.2-3.5-5.8-3.5-10.4c0-6,2.1-13.6,6.2-22.6c0.5-1.1,0.8-2.2,1-3.3c-2.4,0.6-4.9,0.9-7.4,0.9c-8.9,0-16.5-4.1-20.9-11.2c-3.1-5-4.4-11-3.6-17.1c1.3-9.5,7.7-17.3,16.8-20.6c4.6-1.7,9.5-2.2,14.4-1.5c9.2,1.3,16.7,7,20.4,15.6c2.2,5.1,2.9,10.8,2.1,16.5c-1.3,9.4-6.4,18.7-14.7,26.9c-4,3.9-8.4,7.8-13.1,11.5c-0.8,0.6-1.5,1.3-2.1,2c-2.8,3.2-4.3,6.8-4.3,10.4c0,4.2,2.2,6.5,6.5,6.5c4.7,0,9.3-3.6,13.2-10.4c0.5-0.9,0.9-1.9,1.3-3l-22.9-63.5c-1.1-3.1-2.4-5.2-3.9-6.4c-1.5-1.2-3.3-1.7-5.3-1.5c-1.9,0.2-3.5,1-4.7,2.5c-1.2,1.5-1.7,3.3-1.5,5.3c0.4,4,2.5,10.5,6.2,19.5l22.9,63.5c0.6,1.7,0.9,3.5,0.9,5.3c0,4.6-2.3,7.6-6.8,8.8C40.6,118.7,39.1,118.9,37.7,118.9z"/>
          </g>

          <g id="vectorBass" fill="#2D2640" style="display:none;" transform="translate(18, 23) scale(0.62)">
            <path d="M16,50 C16,32 36,30 36,46 C36,62 18,78 14,92 L10,90 C15,76 31,63 31,48 C31,38 20,38 20,50 C20,53 21,55 23,55 C25,55 26,53 26,50 C26,44 16,42 16,50 Z"/>
            <circle cx="43" cy="42.5" r="3.5"/>
            <circle cx="43" cy="57.5" r="3.5"/>
          </g>

          <line x1="135" y1="110" x2="175" y2="110" stroke="#2D2640" stroke-width="2.5" id="svgLedger"/>
          <ellipse cx="155" cy="110" rx="11" ry="8" transform="rotate(-15 155 110)" fill="#2D2640" id="svgNote"/>
        </svg>
      </div>
    </div>

    <div class="options-grid">
      <button class="option-btn" onclick="submitAnswer(this)">A</button>
      <button class="option-btn" onclick="submitAnswer(this)">B</button>
      <button class="option-btn" onclick="submitAnswer(this)">C</button>
      <button class="option-btn" onclick="submitAnswer(this)">D</button>
    </div>
  </div>

  <div class="result-box" id="resultBody">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <h2>挑戰完成！</h2>
    <div class="result-score"><span id="finalScore">0</span> 分</div>
    <div class="result-text" id="resultComment">正在將高級任務成績登錄至雲端...</div>
    <button class="action-btn" onclick="goBackDashboard()">傳回我的控制台 📊</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMIul1XcWHOk45JWXh-xcD8nASQW08hNc",
  authDomain: "music-missho.firebaseapp.com",
  projectId: "music-missho",
  storageBucket: "music-missho.firebasestorage.app",
  messagingSenderId: "542029036241",
  appId: "1:542029036241:web:2275f6e6c7c9685fb763f0",
  measurementId: "G-J3CGDLSGZF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUid = null;
let timerInterval = null;
let timeLeft = 180; 

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUid = user.uid;
    startTimer(); 
  } else {
    alert("請先登入帳號後再進行樂理測驗！");
    window.location.href = "login.html";
  }
});

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const seconds = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timerDisplay').innerText = `⏱️ ${minutes}:${seconds}`;
    
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      alert("時間到！系統已為妳自動提交考卷。");
      showResults(true); 
    }
  }, 1000);
}

const questions = [
  { clef: 'treble', label: '高音譜號', y: 110, ledger: true,  answer: 'C', options: ['C', 'D', 'E', 'F'] }, 
  { clef: 'treble', label: '高音譜號', y: 80,  ledger: false, answer: 'G', options: ['E', 'F', 'G', 'A'] }, 
  { clef: 'treble', label: '高音譜號', y: 35,  ledger: false, answer: 'F', options: ['E', 'F', 'G', 'B'] }, 
  { clef: 'bass',   label: '低音譜號', y: 72.5,ledger: false, answer: 'C', options: ['A', 'B', 'C', 'D'] }, 
  { clef: 'bass',   label: '低音譜號', y: 95,  ledger: false, answer: 'G', options: ['F', 'G', 'A', 'B'] }, 
  { clef: 'treble', label: '高音譜號', y: 95,  ledger: false, answer: 'E', options: ['C', 'D', 'E', 'F'] }, 
  { clef: 'treble', label: '高音譜號', y: 72.5,ledger: false, answer: 'A', options: ['G', 'A', 'B', 'C'] }, 
  { clef: 'bass',   label: '低音譜號', y: 50,  ledger: false, answer: 'F', options: ['D', 'E', 'F', 'G'] }, 
  { clef: 'bass',   label: '低音譜號', y: 57.5,ledger: false, answer: 'E', options: ['C', 'D', 'E', 'F'] }, 
  { clef: 'treble', label: '高音譜號', y: 65,  ledger: false, answer: 'B', options: ['A', 'B', 'C', 'D'] }  
];

let currentIndex = 0;
let correctCount = 0;

function loadQuestion() {
  const q = questions[currentIndex];
  document.getElementById('questionNum').innerText = `任務第 ${currentIndex + 1} / 10 題`;
  document.getElementById('progressBar').style.width = `${(currentIndex + 1) * 10}%`;
  
  const badge = document.getElementById('clefBadge');
  badge.innerText = q.label;
  badge.className = `clef-badge ${q.clef}`;
  
  const trebleG = document.getElementById('vectorTreble');
  const bassG = document.getElementById('vectorBass');
  
  if (q.clef === 'bass') {
    trebleG.style.display = 'none';
    bassG.style.display = 'block';
  } else {
    trebleG.style.display = 'block';
    bassG.style.display = 'none';
  }
  
  const note = document.getElementById('svgNote');
  note.setAttribute('cy', q.y);
  note.setAttribute('transform', `rotate(-15 155 ${q.y})`);
  
  const ledger = document.getElementById('svgLedger');
  if (q.ledger) {
    ledger.style.display = 'block';
    ledger.setAttribute('y1', q.y);
    ledger.setAttribute('y2', q.y);
  } else {
    ledger.style.display = 'none';
  }
  
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach((btn, idx) => { btn.innerText = q.options[idx]; });
}

window.submitAnswer = function(btn) {
  const selected = btn.innerText;
  const correct = questions[currentIndex].answer;
  
  if (selected === correct) {
    correctCount++;
    document.getElementById('scoreTracker').innerText = `得分: ${correctCount * 10}`;
  }
  currentIndex++;
  if (currentIndex < questions.length) {
    loadQuestion();
  } else {
    clearInterval(timerInterval); 
    showResults(false);
  }
}

async function showResults(isTimeout = false) {
  document.getElementById('quizBody').style.display = 'none';
  document.getElementById('resultBody').style.display = 'block';
  
  const finalScore = correctCount * 10;
  document.getElementById('finalScore').innerText = finalScore;
  
  const goldEarned = finalScore; 
  const expEarned = finalScore; 
  
  if (isTimeout) {
    document.getElementById('resultEmoji').innerText = '⏰';
    document.getElementById('resultComment').innerText = `時間到了！但妳的努力已成功登記至系統並換算為獎勵！`;
  } else {
    if (finalScore >= 80) {
      document.getElementById('resultEmoji').innerText = '🏆';
      document.getElementById('resultComment').innerText = `太完美了！成功斬獲 ${goldEarned} 金幣與 ${expEarned} 經驗值！🎶`;
    } else if (finalScore >= 60) {
      document.getElementById('resultEmoji').innerText = '👍';
      document.getElementById('resultComment').innerText = `很不錯！順利贏得 ${goldEarned} 金幣與 ${expEarned} 經驗值！`;
    } else {
      document.getElementById('resultEmoji').innerText = '💪';
      document.getElementById('resultComment').innerText = `再接再厲！本次獲得 ${goldEarned} 金幣與 ${expEarned} 經驗值，多練幾次賺更多！`;
    }
  }

  if (currentUid) {
    try {
      await addDoc(collection(db, "scores"), {
        uid: currentUid,
        quizName: "中一級：五線譜與音名辨識",
        score: finalScore,
        correctAnswers: correctCount,
        totalQuestions: 10,
        timestamp: serverTimestamp()
      });

      const userRef = doc(db, 'users', currentUid);
      await updateDoc(userRef, {
        gold: increment(goldEarned),
        exp: increment(expEarned)
      });
    } catch (e) {
      console.error("雲端更新失敗：", e);
    }
  }
}

window.goBackDashboard = function() { window.location.href = "quiz.html"; }
loadQuestion();
</script>
</body>
</html>
