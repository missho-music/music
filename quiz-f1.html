<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miss Ho's Music Lab - 中一樂理任務 🎼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream:   #FFFBF2;
  --yellow:  #FFD94A;
  --coral:   #FF7B6B;
  --mint:    #4ECDC4;
  --purple:  #A78BFA;
  --blue:    #60A5FA;
  --dark:    #2D2640;
  --ink:     #3D3560;
  --muted:   #8B85A8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--cream);
  font-family: 'Poppins', 'Noto Sans TC', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.quiz-container {
  width: 100%;
  max-width: 600px;
  background: white;
  border: 3.5px solid var(--dark);
  border-radius: 24px;
  padding: 36px 32px;
  box-shadow: 7px 7px 0 var(--dark);
  position: relative;
}

.progress-wrapper {
  margin-bottom: 24px;
}
.progress-text {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 800;
  font-size: 14px;
  margin-bottom: 8px;
  color: var(--muted);
}
.timer-box {
  background: #FFF0F0;
  color: var(--coral);
  border: 2px solid var(--dark);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 14px;
  box-shadow: 2px 2px 0 var(--dark);
}
.progress-bar-outer {
  width: 100%;
  height: 16px;
  background: #f0ede6;
  border: 2.5px solid var(--dark);
  border-radius: 999px;
  overflow: hidden;
}
.progress-bar-inner {
  width: 10%;
  height: 100%;
  background: var(--purple);
  transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.question-box {
  text-align: center;
  margin-bottom: 28px;
}
.question-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.clef-badge {
  padding: 4px 12px;
  border: 2px solid var(--dark);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.clef-badge.treble { background: var(--yellow); }
.clef-badge.bass { background: var(--blue); color: white; }

.staff-wrapper {
  background: #FCFBF7;
  border: 2.5px solid var(--dark);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
  display: flex;
  justify-content: center;
}

.options-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.option-btn {
  padding: 16px;
  border: 2.5px solid var(--dark);
  border-radius: 16px;
  font-family: 'Poppins', sans-serif;
  font-weight: 800;
  font-size: 20px;
  background: white;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--dark);
  transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.option-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--dark);
  background: var(--cream);
}
.option-btn:active {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0 var(--dark);
}

.result-box {
  display: none;
  text-align: center;
  padding: 20px 0;
}
.result-emoji { font-size: 64px; margin-bottom: 16px; }
.result-score { font-size: 48px; font-weight: 900; color: var(--coral); margin-bottom: 8px; }
.result-text { font-size: 16px; font-weight: 700; color: var(--muted); margin-bottom: 28px; }

.action-btn {
  display: inline-block;
  padding: 14px 28px;
  border: 2.5px solid var(--dark);
  border-radius: 16px;
  font-weight: 800;
  font-size: 16px;
  color: var(--dark);
  background: var(--mint);
  text-decoration: none;
  box-shadow: 4px 4px 0 var(--dark);
  cursor: pointer;
  transition: all 0.15s;
}
.action-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--dark); }
</style>
</head>
<body>

<div class="quiz-container">
  
  <div id="quizBody">
    <div class="progress-wrapper">
      <div class="progress-text">
        <span id="questionNum">任務第 1 / 10 題</span>
        <span id="timerDisplay" class="timer-box">⏱️ 03:00</span>
        <span id="scoreTracker">得分: 0</span>
      </div>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progressBar"></div>
      </div>
    </div>

    <div class="question-box">
      <div class="question-title">
        <span id="clefBadge" class="clef-badge treble">高音譜號</span>
        <span>請辨認五線譜上的音名是什麼？</span>
      </div>
      
      <div class="staff-wrapper">
        <svg width="300" height="150" id="staffSvg" viewBox="0 0 300 150">
          <line x1="10" y1="35" x2="290" y2="35" stroke="#2D2640" stroke-width="2.5"/>
          <line x1="10" y1="50" x2="290" y2="50" stroke="#2D2640" stroke-width="2.5"/>
          <line x1="10" y1="65" x2="290" y2="65" stroke="#2D2640" stroke-width="2.5"/>
          <line x1="10" y1="80" x2="290" y2="80" stroke="#2D2640" stroke-width="2.5"/>
          <line x1="10" y1="95" x2="290" y2="95" stroke="#2D2640" stroke-width="2.5"/>

          <text x="15" y="105" font-size="75" id="svgClef" font-family="serif" fill="#2D2640">𝄞</text>

          <line x1="135" y1="110" x2="175" y2="110" stroke="#2D2640" stroke-width="2.5" id="svgLedger"/>
          <ellipse cx="155" cy="110" rx="11" ry="8" transform="rotate(-15 155 110)" fill="#2D2640" id="svgNote"/>
        </svg>
      </div>
    </div>

    <div class="options-grid">
      <button class="option-btn" onclick="submitAnswer(this)">A</button>
      <button class="option-btn" onclick="submitAnswer(this)">B</button>
      <button class="option-btn" onclick="submitAnswer(this)">C</button>
      <button class="option-btn" onclick="submitAnswer(this)">D</button>
    </div>
  </div>

  <div class="result-box" id="resultBody">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <h2>挑戰完成！</h2>
    <div class="result-score"><span id="finalScore">0</span> 分</div>
    <div class="result-text" id="resultComment">正在將成績安全登錄至 Miss Ho's 雲端資料庫...</div>
    <button class="action-btn" onclick="goBackDashboard()">傳回我的控制台 📊</button>
  </div>

</div>

<!-- Firebase 模組架構 -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, doc, updateDoc, increment, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMIul1XcWHOk45JWXh-xcD8nASQW08hNc",
  authDomain: "music-missho.firebaseapp.com",
  projectId: "music-missho",
  storageBucket: "music-missho.firebasestorage.app",
  messagingSenderId: "542029036241",
  appId: "1:542029036241:web:2275f6e6c7c9685fb763f0",
  measurementId: "G-J3CGDLSGZF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUid = null;
let timerInterval = null;
let timeLeft = 180; 

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUid = user.uid;
    startTimer();
  } else {
    alert("請先登入帳號後再進行樂理測驗！");
    window.location.href = "login.html";
  }
});

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    
    const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const seconds = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timerDisplay').innerText = `⏱️ ${minutes}:${seconds}`;
    
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      alert("時間到！系統已為妳自動提交考卷。");
      showResults(true); 
    }
  }, 1000);
}

const questions = [
  { clef: 'treble', label: '高音譜號', symbol: '𝄞', y: 110, ledger: true,  answer: 'C', options: ['C', 'D', 'E', 'F'] }, 
  { clef: 'treble', label: '高音譜號', symbol: '𝄞', y: 80,  ledger: false, answer: 'G', options: ['E', 'F', 'G', 'A'] }, 
  { clef: 'treble', label: '高音譜號', symbol: '𝄞', y: 35,  ledger: false, answer: 'F', options: ['E', 'F', 'G', 'B'] }, 
  { clef: 'bass',   label: '低音譜號', symbol: '𝄢', y: 72.5,ledger: false, answer: 'C', options: ['A', 'B', 'C', 'D'] }, 
  { clef: 'bass',   label: '低音譜號', symbol: '𝄢', y: 95,  ledger: false, answer: 'G', options: ['F', 'G', 'A', 'B'] }, 
  { clef: 'treble', label: '高音譜號', symbol: '𝄞', y: 95,  ledger: false, answer: 'E', options: ['C', 'D', 'E', 'F'] }, 
  { clef: 'treble', label: '高音譜號', symbol: '𝄞', y: 72.5,ledger: false, answer: 'A', options: ['G', 'A', 'B', 'C'] }, 
  { clef: 'bass',   label: '低音譜號', symbol: '𝄢', y: 50,  ledger: false, answer: 'F', options: ['D', 'E', 'F', 'G'] }, 
  { clef: 'bass',   label: '低音譜號', symbol: '𝄢', y: 57.5,ledger: false, answer: 'E', options: ['C', 'D', 'E', 'F'] }, 
  { clef: 'treble', label: '高音譜號', symbol: '𝄞', y: 65,  ledger: false, answer: 'B', options: ['A', 'B', 'C', 'D'] }  
];

let currentIndex = 0;
let correctCount = 0;

function loadQuestion() {
  const q = questions[currentIndex];
  
  document.getElementById('questionNum').innerText = `任務第 ${currentIndex + 1} / 10 題`;
  document.getElementById('progressBar').style.width = `${(currentIndex + 1) * 10}%`;
  
  const badge = document.getElementById('clefBadge');
  badge.innerText = q.label;
  badge.className = `clef-badge ${q.clef}`;
  
  const clefText = document.getElementById('svgClef');
  clefText.innerHTML = q.symbol;
  
  if (q.clef === 'bass') {
    clefText.setAttribute('font-size', '60');
    clefText.setAttribute('x', '15');
    clefText.setAttribute('y', '62'); 
  } else {
    clefText.setAttribute('font-size', '75');
    clefText.setAttribute('x', '15');
    clefText.setAttribute('y', '106'); 
  }
  
  const note = document.getElementById('svgNote');
  note.setAttribute('cy', q.y);
  note.setAttribute('transform', `rotate(-15 155 ${q.y})`);
  
  const ledger = document.getElementById('svgLedger');
  if (q.ledger) {
    ledger.style.display = 'block';
    ledger.setAttribute('y1', q.y);
    ledger.setAttribute('y2', q.y);
  } else {
    ledger.style.display = 'none';
  }
  
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach((btn, idx) => {
    btn.innerText = q.options[idx];
  });
}

window.submitAnswer = function(btn) {
  const selected = btn.innerText;
  const correct = questions[currentIndex].answer;
  
  if (selected === correct) {
    correctCount++;
    document.getElementById('scoreTracker').innerText = `得分: ${correctCount * 10}`;
  }
  
  currentIndex++;
  
  if (currentIndex < questions.length) {
    loadQuestion();
  } else {
    clearInterval(timerInterval); 
    showResults(false);
  }
}

async function showResults(isTimeout = false) {
  document.getElementById('quizBody').style.display = 'none';
  document.getElementById('resultBody').style.display = 'block';
  
  const finalScore = correctCount * 10;
  document.getElementById('finalScore').innerText = finalScore;
  
  const goldEarned = finalScore;
  const expEarned = finalScore;
  
  if (isTimeout) {
    document.getElementById('resultEmoji').innerText = '⏰';
    document.getElementById('resultComment').innerText = `時間到了！但妳的努力已成功登記至系統並換算為 ${goldEarned} 金幣與 ${expEarned} 經驗值！`;
  } else {
    if (finalScore >= 80) {
      document.getElementById('resultEmoji').innerText = '🏆';
      document.getElementById('resultComment').innerText = `太完美了！成功斬獲 ${goldEarned} 金幣與 ${expEarned} 經驗值！🎶`;
    } else if (finalScore >= 60) {
      document.getElementById('resultEmoji').innerText = '👍';
      document.getElementById('resultComment').innerText = `很不錯！順利贏得 ${goldEarned} 金幣與 ${expEarned} 經驗值！`;
    } else {
      document.getElementById('resultEmoji').innerText = '💪';
      document.getElementById('resultComment').innerText = `再接再厲！本次獲得 ${goldEarned} 金幣與 ${expEarned} 經驗值，多挑戰幾次賺更多！`;
    }
  }

  if (currentUid) {
    try {
      await addDoc(collection(db, "scores"), {
        uid: currentUid,
        quizName: "中一級：五線譜與音名辨識",
        score: finalScore,
        correctAnswers: correctCount,
        totalQuestions: 10,
        timestamp: serverTimestamp()
      });

      const userRef = doc(db, 'users', currentUid);
      await updateDoc(userRef, {
        gold: increment(goldEarned),
        exp: increment(expEarned)
      });
      console.log(`[Lab 廣播] 雲端帳戶更新成功！金幣 +${goldEarned}，經驗值 +${expEarned}。`);
      
    } catch (e) {
      console.error("寫入分數或加載雲端帳戶失敗: ", e);
    }
  }
}

window.goBackDashboard = function() {
  window.location.href = "quiz.html";
}

loadQuestion();
</script>

</body>
</html>
